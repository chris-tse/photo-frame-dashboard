<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eef2ef"><title>Komorebi · Home dashboard</title></head><body>
<header class="topbar"><a class="brand" href="#home">Home</a><nav aria-label="Dashboard screens"><button data-view="home" aria-current="page">Home</button><button data-view="shopping">Shopping</button><button data-view="tasks">Tasks</button><button data-view="calendar">Calendar</button></nav><div class="header-end"><span class="demo-label">Demo household</span><button id="theme" aria-pressed="false">Dark mode</button></div></header>
<main id="content"></main><div id="toast" role="status" aria-live="polite"></div>
<dialog id="event-dialog"><form id="event-form"><div class="section-heading"><h2 id="event-dialog-title">Add event</h2><button type="button" data-close-dialog aria-label="Close event">×</button></div><label>Title<input name="title" required maxlength="100" autocomplete="off"></label><label>Day<input name="date" type="date" required></label><div class="form-two"><label>Starts<input name="start" type="time" required></label><label>Ends<input name="end" type="time" required></label></div><label>For<select name="person"><option value="family">Everyone</option><option value="alex">Alex</option><option value="sam">Sam</option><option value="mika">Mika</option><option value="ren">Ren</option></select></label><label>Where<input name="location" maxlength="100" autocomplete="off"></label><p id="event-error" role="alert"></p><div class="dialog-actions"><button type="button" id="delete-event">Delete event</button><button type="submit" class="solid">Save event</button></div></form></dialog>
<dialog id="work-dialog"><div class="section-heading"><h2 id="work-dialog-title">Meeting details</h2><button id="work-dialog-close" type="button" aria-label="Close meeting details">×</button></div><div id="work-dialog-content"></div></dialog>
<dialog id="gateway-dialog"><form id="gateway-form"><h2>Calendar connection</h2><p>Leave empty to disconnect.</p><label>CalendarGateway base URL<input id="gateway-url" type="url" placeholder="http://192.168.1.50:8787"></label><p id="gateway-error" role="alert"></p><div class="dialog-actions"><button id="gateway-close" type="button">Cancel</button><button class="solid" type="submit">Save connection</button></div></form></dialog>
<script type="module" src="/main.js"></script></body></html>
